<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <h2 id="logo-name">FOOD MART</h2>

            </div>
        </div>

<!--item section-->
<section class="main-part container" id="item-section">
    <section class="row">
        <section class="Items_Details_Form col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <div class="card cardSize">
                <div id="Card-Header-back-colour-item" class="card-header">
                    Items Details
                </div>
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label for="item-code" class="form-label">Item code</label>
                            <input type="text" class="form-control" id="item-code">
                        </div>

                        <div class="mb-3">
                            <label for="item-name" class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="item-name" placeholder="Enter Item name">
                        </div>

                        <div class="mb-3">
                            <label for="unit-price" class="form-label">Unit Price</label>
                            <input type="number" class="form-control" placeholder="Enter price" id="unit-price">
                        </div>

                        <div class="mb-3">
                            <label for="qty-on-hand" class="form-label">Quantity On Hand</label>
                            <input type="number" class="form-control" placeholder="Enter qty" id="qty-on-hand">
                        </div>

                        <div class="text-end ">
                            <button type="button" class="btn btn-success" id="item-save">Save</button>
                            <button type="button" class="btn btn-primary" id="item-update">Update</button>
                            <button type="button" class="btn btn-danger" id="item-delete">Delete</button>
                            <button type="reset" class="btn btn-warning" id="item-reset">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="Custom_Search_Items col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <div class="card" >
                <div  class="card-body">
                    <h5 id="search-bar-item" class="card-title">Search Items</h5>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Enter Item Code" id="item-search-code" aria-label="Search">
                        <button class="btn btn-outline-primary" type="button" id="item-search">Search</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="Item-Table-View col-12 col-sm-12 col-md-12 col-lg-10 col-xl-10 col-xxl-10">
            <table class="table table-secondary table-striped" >
                <thead>
                <tr>
                    <th scope="col">Item Code</th>
                    <th scope="col">Item name</th>
                    <th scope="col">Item price</th>
                    <th scope="col">Item quantity</th>
                </tr>
                </thead>
                <tbody  id="item-tbl-tbody">
                <tr>
                    <td>I-001</td>
                    <td>Milk powder</td>
                    <td>750.00</td>
                    <td>10</td>

                </tr>
                <tr>
                    <td>I-002</td>
                    <td>Diana-Chocolate Biscuit</td>
                    <td>130.00</td>
                    <td>24</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
