    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pacifico&display=swap" rel="stylesheet">

</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <h2 id="logo-name">FOOD MART</h2>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="dashboard.html">Home</a>

                    <li class="nav-item">
                        <a class="nav-link" href="customer.html">Customer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="item.html">Items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="placeOrder.html">Orders</a>
                    </li>
                    <li class="nav-item">

                <a href="dashboard.html" class="btn btn-outline-primary log-out-btn">LogOut</a>
            </div>

<!--order section-->
<section class="main-part container" id="order-section">
    <section class="row">
        <section class="Order_Details_Form col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <div class="card invoice-cardSize">
                <div id="invoice-details-header " class="card-header Card-header-colour">
                    Invoice Details
                </div>
                <div class="card-body invoice-card">
                    <form class="row g-3">
                        <div class="col-md-6">
                            <label for="order-id" class="form-label">Order ID</label>
                            <input type="text" class="form-control" id="order-id">
                        </div>
                        <div class="col-md-6">
                            <label for="order-date" class="form-label">Order Date</label>
                            <input type="text" class="form-control input-Date" id="order-date">
                        </div>

                        <div class="col-md-6 mt-3 mb-3">
                            <label class="form-label fw-bold">Customer ID</label>
                            <select class="form-select" name="customer"  id="custIdOption">
                                <option disabled selected value="">select customer ID</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Customer Name</label>
                            <input type="text" class="form-control customer-name-set" id="set-customer-name">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Customer Email</label>
                            <input type="email" class="form-control customer-name-set" id="set-customer-email">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Total</label>
                            <input type="number" class="form-control" id="total" style="color: #ff253a" placeholder="Total Here" disabled>
                        </div>

                        <div class="col-md-6">
                            <label for="discount" class="form-label">Discount</label>
                            <input type="number" class="form-control" id="discount" placeholder="Discount in percentage Here">
                        </div>

                        <div class="col-md-6">
                            <label for="sub-total" class="form-label">Sub Total</label>
                            <input type="number" class="form-control" id="sub-total" style="color: blue" placeholder="Sub Total Here" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="Cash" class="form-label">Cash</label>
                            <input type="number" class="form-control" id="cash" placeholder="Cash Here">
                        </div>
                        <div class="col-md-6">
                            <label for="balance" class="form-label">Balance</label>
                            <input type="number" class="form-control" id="balance" placeholder="Balance Here" disabled>
                        </div>
                        <div class="mt-1 mb-3" id="button">
                            <button id="btn-purchase" type="button" class="btn btn-success">Purchase</button>
                            <button id="invoice-update-btn" type="button" class="btn btn-primary">Update</button>
                            <button id="invoice-delete-btn" type="button" class="btn btn-warning">Delete</button>
                            <button id="resetAllBtn" type="reset" class="btn btn-danger">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="select-item-Form col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <div class="card cardSize-item">
                <div class="card-header Card-header-colour">
                    Item Details
                </div>
                <div class="card-body select-item-card">
                    <form class="row g-3">

                        <div class="col-md-6 mt-3 mb-3">
                            <label class="form-label fw-bold">Item Code </label>
                            <select class="form-select" name="item" id="itemCodeOption">
                                <option disabled selected value="">Select item Code</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label  class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="set-order-form-item-name" placeholder="Item Name Here" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" id="set-order-form-item-price" placeholder="Price Here" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Qty on Hand</label>
                            <input type="number" class="form-control" id="set-item-qty-on-hand" placeholder="Qty on hand Here" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="order-form-get-qty" class="form-label">Getting Qty</label>
                            <input type="number" class="form-control" id="order-form-get-qty" placeholder="Qty Here">
                        </div>
                        <div class="col-12 text-end" id="button1">
                            <button id="add-to-cart-btn" type="button" class="btn btn-warning" style="width: 140px">Add to cart</button>
                            <button id="update-item-btn" type="button" class="btn btn-primary">Update</button>
                            <button id="remove-item-btn" type="button" class="btn btn-success">Remove</button>
                            <button id="reset-order-details-btn" type="reset" class="btn btn-danger">Reset</button>
                        </div>
                        <div class="col m-3">
                            <table class="table" id="item-order-table">
                                <thead class="table-primary">
                                <tr>
                                    <th scope="col">Item Code</th>
                                    <th scope="col">Item Name</th>
                                    <th scope="col">Item Price</th>
                                    <th scope="col">Qty On Hand</th>
                                    <th scope="col">Qty</th>
                                    <th scope="col">Total</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="search-order col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <div class="card" >
                <div  class="card-body">
                    <h5 id="search-bar-order" class="card-title">Search Order</h5>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Enter order Id" id="order-search-by-id" aria-label="Search">
                        <button class="btn btn-outline-primary" type="button" id="order-search">Search</button>
                    </form>
                </div>
            </div>
        </section>
    </section>
</section>



<script src="../../../fontawesome-free-6.5.1-web/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
